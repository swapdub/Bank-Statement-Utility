services:
  backend:
    build:
      context: ..          # repo root — needed to include bank_statement_utility
      dockerfile: web/Dockerfile.backend
    env_file: .env         # loads ALLOWED_ORIGINS and other backend config
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/data:/app/data    # persist SQLite database
    restart: unless-stopped

  frontend:
    build:
      context: .           # web/ directory
      dockerfile: Dockerfile.frontend
      args:
        # Leave empty — nginx proxy handles /api routing inside Docker
        VITE_API_BASE_URL: ""
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped
